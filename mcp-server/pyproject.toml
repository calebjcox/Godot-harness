[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-claude-harness"
version = "1.0.0"
description = "MCP server that gives Claude Code autonomous testing access to a running Godot 4 game"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
godot-claude-harness = "server:main"

[tool.setuptools.packages.find]
where = ["."]
